<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-label="Delivery process diagram">
  <style>
    .label { font: 600 11px ui-monospace, 'JetBrains Mono', monospace; fill: #0b1220; }
    .sub { font: 500 9px ui-monospace, 'JetBrains Mono', monospace; fill: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .num { font: 600 10px ui-monospace, 'JetBrains Mono', monospace; fill: #1d4ed8; letter-spacing: 0.1em; }
    .stroke { fill: none; stroke: #334155; stroke-width: 1.25; }
    .accent { fill: none; stroke: #1d4ed8; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.25; }
  </style>

  <!-- baseline -->
  <line x1="30" y1="120" x2="690" y2="120" class="stroke" />

  <!-- nodes -->
  <g>
    <circle cx="55" cy="120" r="9" fill="#1d4ed8" />
    <text x="55" y="148" class="num" text-anchor="middle">01</text>
    <text x="55" y="170" class="label" text-anchor="middle">discovery</text>
    <text x="55" y="186" class="sub" text-anchor="middle">scope</text>
  </g>

  <g>
    <circle cx="150" cy="120" r="7" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="150" y="148" class="num" text-anchor="middle">02</text>
    <text x="150" y="170" class="label" text-anchor="middle">contract</text>
    <text x="150" y="186" class="sub" text-anchor="middle">sow signed</text>
  </g>

  <g>
    <circle cx="250" cy="120" r="7" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="250" y="148" class="num" text-anchor="middle">03</text>
    <text x="250" y="170" class="label" text-anchor="middle">onboard</text>
    <text x="250" y="186" class="sub" text-anchor="middle">access · tools</text>
  </g>

  <g>
    <rect x="320" y="105" width="100" height="30" fill="#1d4ed8" />
    <text x="370" y="124" class="label" text-anchor="middle" style="fill:#ffffff">sprint loop</text>
    <text x="370" y="148" class="num" text-anchor="middle">04</text>
    <text x="370" y="170" class="label" text-anchor="middle">delivery</text>
    <text x="370" y="186" class="sub" text-anchor="middle">2-week · demo</text>
  </g>

  <g>
    <circle cx="480" cy="120" r="7" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="480" y="148" class="num" text-anchor="middle">05</text>
    <text x="480" y="170" class="label" text-anchor="middle">compliance qa</text>
    <text x="480" y="186" class="sub" text-anchor="middle">controls validated</text>
  </g>

  <g>
    <circle cx="580" cy="120" r="7" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    <text x="580" y="148" class="num" text-anchor="middle">06</text>
    <text x="580" y="170" class="label" text-anchor="middle">handover</text>
    <text x="580" y="186" class="sub" text-anchor="middle">runbooks + code</text>
  </g>

  <g>
    <circle cx="670" cy="120" r="9" fill="#1d4ed8" />
    <text x="670" y="148" class="num" text-anchor="middle">07</text>
    <text x="670" y="170" class="label" text-anchor="middle">support</text>
    <text x="670" y="186" class="sub" text-anchor="middle">retainer</text>
  </g>

  <!-- sprint loop arc -->
  <path d="M320 105 Q370 65 420 105" class="accent" stroke-dasharray="4 4" />
  <polygon points="320,105 326,99 326,111" fill="#1d4ed8" />

  <!-- header -->
  <text x="30" y="50" class="sub">SNOWOPS DELIVERY MODEL · 7 PHASES</text>
  <line x1="30" y1="60" x2="690" y2="60" stroke="#cbd5e1" stroke-width="1" />
</svg>
